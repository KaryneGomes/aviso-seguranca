<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>git status --alert</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .badge {
      display: inline-block;
      background-color: rgba(248, 81, 73, 0.15);
      color: #f85149;
      border: 1px solid rgba(248, 81, 73, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .message {
      font-size: 1.5rem;
      line-height: 1.6;
      color: #f0f6fc;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .highlight {
      color: #f85149;
      display: block;
      margin-bottom: 6px;
    }

    .submessage {
      font-size: 1.15rem;
      color: #8b949e;
      margin-bottom: 28px;
    }

    .warning-sign {
      display: inline-block;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #e3b341;
      border-top: 1px dashed #30363d;
      padding-top: 20px;
      width: 100%;
    }

    .terminal-command {
      margin-top: 24px;
      background-color: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.85rem;
      color: #58a6ff;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Security Alert</div>
    
    <div class="message">
      <span class="highlight">Não deixe mais o git aberto,</span>
      tenha cuidado com suas coisas.
    </div>

    <div class="warning-sign">
      // AVISO DADO
    </div>

    <div class="terminal-command">
      $ git commit -m "feat: salvando seu perfil antes de deslogar"
    </div>
  </div>

</body>
</html>
